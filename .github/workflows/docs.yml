steps:
  - uses: actions/configure-pages@v6
  - uses: actions/checkout@v7
  - uses: actions/setup-python@v6
    with:
      python-version: 3.x
  - run: pip install zensical         # instala Zensical
  - run: zensical build --clean       # convierte docs/*.md → site/*.html
  - uses: actions/upload-pages-artifact@v5
    with:
      path: site                      # sube la carpeta generada
  - uses: actions/deploy-pages@v5
