[project]
site_name = "Surikata3k IT-Hub"
site_description = "IT snippets, tutorials, practice exercises and resources"
site_author = "Surikata3k"
site_url = "https://surikata3k.github.io/it-hub/"
repo_url = "https://github.com/surikata3k/it-hub"
repo_name = "surikata3k/it-hub"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Surikata3k"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Linux" = [
    "linux/index.md",
    { "System" = "linux/system.md" },
    { "Networking" = "linux/networking.md" },
    { "Nano" = "linux/nano.md" },
    { "Tmux" = "linux/tmux.md" },
  ] },
  { "Docker" = [
    "docker/index.md",
    { "Basics" = "docker/basics.md" },
    { "Create images" = "docker/images.md" },
    { "Storage and networks" = "docker/storage-networks.md" },
    { "Ready-to-run containers" = "docker/containers.md" },
  ] },
  { "Windows" = [
    "windows/index.md",
    { "Tips" = "windows/tips.md" },
    { "Remote PowerShell" = "windows/remote-powershell.md" },
    { "SSH" = "windows/ssh.md" },
    { "WSL" = "windows/wsl.md" },
  ] },
  { "Databases" = [
    "databases/index.md",
    { "Database containers" = "databases/containers.md" },
    { "Oracle" = "databases/oracle.md" },
  ] },
  { "Resources" = [
    "resources/index.md",
    { "Links" = "resources/links.md" },
    { "VS Code" = "resources/vscode.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/terminal"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/surikata3k"
